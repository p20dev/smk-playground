[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smk-playground"
version = "0.1.0"
description = "Reproducible visual feature engineering and experimental analysis for SMK artworks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1",
  "ijson>=3.3",
  "numpy>=2",
  "polars>=1",
  "pyarrow>=18",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
smk = "smk_playground.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
